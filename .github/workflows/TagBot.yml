name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

# The upstream TagBot template uses repository-default token permissions.
# Configure Actions permissions after creating the remote repository.
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@ffef3282bcacf1055e4d621a5c010959dfbe59ff # v1.25.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
